name: Quality

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Node ${{ matrix.node-version }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                node-version: ['22.22.2', '24.15.0']

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Node einrichten
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Dependencies installieren
              run: npm ci

            - name: Syntax, Lint, Format, Tests, Coverage und Audit
              run: npm run verify

    package-smoke:
        name: Electron-Paket und Metadaten
        needs: quality
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Node einrichten
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22.22.2'
                  cache: 'npm'

            - name: Dependencies und Metadaten-Validatoren installieren
              run: |
                  npm ci
                  sudo apt-get update
                  sudo apt-get install --yes appstream desktop-file-utils xvfb

            - name: AppStream und Desktop-Datei validieren
              run: |
                  appstreamcli validate --no-net build/de.gr33n93.TippTrainer.metainfo.xml
                  desktop-file-validate build/de.gr33n93.TippTrainer.desktop

            - name: Electron-Paket bauen und Inhalt prüfen
              run: |
                  npm run pack -- --publish never
                  ./node_modules/.bin/asar list dist-electron/linux-unpacked/resources/app.asar > /tmp/tipptrainer-asar-files.txt
                  if grep -Eq '^/(tests|node_modules|\.github)/' /tmp/tipptrainer-asar-files.txt; then exit 1; fi

            - name: Paketierten Electron-Start testen
              run: |
                  sudo chown root:root dist-electron/linux-unpacked/chrome-sandbox
                  sudo chmod 4755 dist-electron/linux-unpacked/chrome-sandbox
                  status=0
                  xvfb-run -a timeout 10s dist-electron/linux-unpacked/tipptrainer-stbw --disable-gpu || status=$?
                  test "$status" -eq 0 -o "$status" -eq 124

name: Release AppImage

on:
    push:
        tags:
            - 'v*' # Baut und released nur bei Version-Tags (z. B. v1.0.0)
    workflow_dispatch: # Manueller Build ohne Release

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-appimage:
        name: Linux AppImage
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Node einrichten
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22.22.2'
                  cache: 'npm'

            - name: Dependencies und Display-Testumgebung installieren
              run: |
                  npm ci
                  sudo apt-get update
                  sudo apt-get install --yes xvfb

            - name: Vollständige Qualitätsprüfung
              run: npm run verify

            - name: Tag und Paketversion abgleichen
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
                  git branch --remotes --contains "$GITHUB_SHA" | grep --quiet 'origin/main'

            - name: Paketiertes responsives Layout prüfen
              run: |
                  npm run pack -- --publish never
                  xvfb-run -a npm run test:layout -- dist-electron/linux-unpacked/resources/app.asar

            - name: Electron-AppImage bauen
              run: npm run dist:appimage -- --publish never

            - name: SHA-256-Prüfsumme erzeugen
              working-directory: dist-electron
              run: sha256sum ./*.AppImage > SHA256SUMS.txt

            - name: Artefakte hochladen
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: tipptrainer-appimage
                  path: |
                      dist-electron/*.AppImage
                      dist-electron/SHA256SUMS.txt
                  if-no-files-found: error
                  retention-days: 30

    release:
        name: GitHub Release erstellen
        needs: build-appimage
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write

        steps:
            - name: Artefakte herunterladen
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: tipptrainer-appimage
                  path: artifacts

            - name: Release erstellen
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  files: |
                      artifacts/*.AppImage
                      artifacts/SHA256SUMS.txt
                  generate_release_notes: true
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
